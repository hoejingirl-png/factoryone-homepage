</header><main class="toolShell"><section class="toolHero"><div><div class="breadcrumbs">홈 · 웹도구 · D-day 날짜 계산기</div><h1>D-day 날짜 계산기</h1><p>목표일까지 남은 날짜와 두 날짜 사이 일수를 계산합니다.</p></div></section>
<section class="panel"><div class="fieldGrid"><div class="field2"><label>기준일</label><input id="start" type="date"></div><div class="field2"><label>목표일</label><input id="end" type="date"></div></div><div class="resultCard"><div class="resultBig" id="dday">-</div><div class="resultSub" id="detail">날짜를 선택하세요.</div></div></section></main></div><script>const today=new Date();const iso=d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};start.value=iso(today);end.value=iso(new Date(today.getTime()+7*86400000));function calc(){if(!start.value||!end.value)return;const a=new Date(start.value+'T00:00:00'),b=new Date(end.value+'T00:00:00'),days=Math.round((b-a)/86400000);dday.textContent=days===0?'D-DAY':days>0?'D-'+days:'D+'+Math.abs(days);detail.textContent=`두 날짜 차이 ${Math.abs(days).toLocaleString()}일`;};[start,end].forEach(x=>x.oninput=calc);calc();</script><script src="/assets/tool-discovery.js"></script></body></html>
