<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR 코드 생성기 | 무료 웹도구 - Factory One</title><meta name="description" content="URL이나 텍스트를 QR 코드로 만들어 PNG로 저장합니다."><link rel="stylesheet" href="../../style.css"><meta name="robots" content="index,follow"><link rel="canonical" href="https://factoryone.kr/tools/qr-generator/"><meta property="og:site_name" content="Factory One"><meta property="og:title" content="QR 코드 생성기 | 무료 웹도구 - Factory One"><meta property="og:description" content="URL이나 텍스트를 QR 코드로 만들어 PNG로 저장합니다."><meta property="og:type" content="website"><meta property="og:url" content="https://factoryone.kr/tools/qr-generator/"><script src="/assets/analytics.js" defer></script></head><body><div class="wrap"><header><div class="logo" onclick="location.href='../../index.html'">FACTORY ONE</div><div class="nav"><button onclick="location.href='../../index.html'">HOME</button><button onclick="location.href='../../tools/'">TOOLS</button></div></header><main class="toolShell"><section class="toolHero"><div><div class="breadcrumbs">홈 · 웹도구 · QR 코드 생성기</div><h1>QR 코드 생성기</h1><p>URL이나 텍스트를 QR 코드로 만들어 PNG로 저장합니다.</p></div></section><section class="panel"><div class="field2"><label>URL 또는 텍스트</label><textarea id="value" style="width:100%;min-height:100px" placeholder="https://factoryone.kr/"></textarea></div><div class="pdfActions"><button id="run" class="primaryBtn">QR 코드 만들기</button></div><div id="qr" style="margin-top:20px"></div><div id="status" class="statusBox">내용을 입력하세요.</div></section></main></div><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script>run.onclick=()=>{qr.innerHTML='';if(!value.value.trim()){status.textContent='내용을 입력하세요.';return;}new QRCode(qr,{text:value.value.trim(),width:256,height:256});status.textContent='QR 코드를 만들었습니다. 이미지를 우클릭해 저장할 수 있습니다.';};</script><script src="/assets/tool-discovery.js"></script></body></html>
