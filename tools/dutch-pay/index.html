</header><main class="toolShell"><section class="toolHero"><div><div class="breadcrumbs">홈 · 웹도구 · 더치페이 계산기</div><h1>더치페이 계산기</h1><p>총 결제금액과 인원, 추가비용을 입력해 1인당 금액을 계산합니다.</p></div></section>
<section class="panel"><div class="fieldGrid three"><div class="field2"><label>총 결제금액</label><input id="total" type="number" value="85000" min="0"></div><div class="field2"><label>인원</label><input id="people" type="number" value="4" min="1"></div><div class="field2"><label>추가비용</label><input id="extra" type="number" value="0" min="0"></div></div><div class="resultCard"><div class="resultBig" id="each">-</div><div class="resultSub" id="detail">1인당 금액을 계산합니다.</div></div></section></main></div><script>function calc(){const sum=Math.max(0,Number(total.value)||0)+Math.max(0,Number(extra.value)||0),n=Math.max(1,Math.floor(Number(people.value)||1)),v=sum/n;each.textContent=Math.ceil(v).toLocaleString()+'원 / 1인';detail.textContent=`총 ${sum.toLocaleString()}원 · ${n}명 기준`;};[total,people,extra].forEach(x=>x.oninput=calc);calc();</script><script src="/assets/tool-discovery.js"></script></body></html>
