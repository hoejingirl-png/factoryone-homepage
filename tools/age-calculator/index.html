</header><main class="toolShell"><section class="toolHero"><div><div class="breadcrumbs">홈 · 웹도구 · 나이 계산기</div><h1>나이 계산기</h1><p>생년월일과 기준일을 입력해 만 나이와 연 나이를 계산합니다.</p></div></section>
<section class="panel"><div class="fieldGrid"><div class="field2"><label>생년월일</label><input id="birth" type="date" value="1990-01-01"></div><div class="field2"><label>기준일</label><input id="base" type="date"></div></div><div class="statGrid"><div class="stat"><span>만 나이</span><b id="full">-</b></div><div class="stat"><span>연 나이</span><b id="yearAge">-</b></div><div class="stat"><span>태어난 지</span><b id="days">-</b></div></div></section></main></div><script>const t=new Date();base.value=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;function calc(){if(!birth.value||!base.value)return;const b=new Date(birth.value+'T00:00:00'),d=new Date(base.value+'T00:00:00');let a=d.getFullYear()-b.getFullYear();if(d.getMonth()<b.getMonth()||(d.getMonth()===b.getMonth()&&d.getDate()<b.getDate()))a--;full.textContent=Math.max(0,a)+'세';yearAge.textContent=Math.max(0,d.getFullYear()-b.getFullYear())+'세';days.textContent=Math.max(0,Math.floor((d-b)/86400000)).toLocaleString()+'일';};[birth,base].forEach(x=>x.oninput=calc);calc();</script><script src="/assets/tool-discovery.js"></script></body></html>
